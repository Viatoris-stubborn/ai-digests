function preferredTheme(){const saved=localStorage.getItem(themeKey);if(saved==='light'||saved==='dark')return saved;return window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';}
function applyTheme(theme){document.documentElement.dataset.theme=theme;const b=document.getElementById('themeToggle');if(b){b.textContent=theme==='light'?'🌙':'☀️';b.title=theme==='light'?'Включить тёмную тему':'Включить светлую тему';}}
applyTheme(preferredTheme());
document.getElementById('themeToggle').onclick=()=>{const next=document.documentElement.dataset.theme==='light'?'dark':'light';localStorage.setItem(themeKey,next);applyTheme(next);};
const data = JSON.parse(document.getElementById('digest-data').textContent || '[]');
const pinsKey='ai-digest-pins-v1';
const pins=new Set(JSON.parse(localStorage.getItem(pinsKey)||'[]'));
let state={view:'all',topic:'all',date:null,q:''};
const topicOrder=['Робототехника','SLAM/Навигация','Квадрупеды','Гуманоиды','VLA/World Models','Perception','LLM','Coding Agents','Open-weight','Инструменты'];
function topics(){return [...new Set(data.flatMap(x=>x.topics||[]))].sort((a,b)=>topicOrder.indexOf(a)-topicOrder.indexOf(b));}
function savePins(){localStorage.setItem(pinsKey,JSON.stringify([...pins]));}
function renderNav(){const nav=document.getElementById('topicNav');nav.innerHTML='';topics().forEach(t=>{const b=document.createElement('button');b.className='navbtn';b.textContent=t;b.onclick=()=>{state.topic=t;state.date=null;state.view='all';render();};nav.appendChild(b)});
const counts={}; data.forEach(x=>counts[x.date]=(counts[x.date]||0)+1); const cal=document.getElementById('calendar');cal.innerHTML=''; Object.keys(counts).sort().reverse().forEach(d=>{const b=document.createElement('button');b.className='navbtn calday';b.innerHTML=`<span>${new Date(d+'T00:00:00').toLocaleDateString('ru-RU',{day:'2-digit',month:'short',year:'numeric'})}</span><span class="count">${counts[d]}</span>`;b.onclick=()=>{state.date=d;state.topic='all';state.view='all';render();};cal.appendChild(b)});
const fs=document.getElementById('filters');fs.innerHTML='';['all',...topics()].forEach(t=>{const b=document.createElement('button');b.className='chip'+(state.topic===t?' active':'');b.textContent=t==='all'?'Все':t;b.onclick=()=>{state.topic=t;state.date=null;render()};fs.appendChild(b)});}
function match(x){if(state.view==='pins'&&!pins.has(x.id))return false;if(state.topic!=='all'&&!(x.topics||[]).includes(state.topic))return false;if(state.date&&x.date!==state.date)return false;if(state.q){const s=(x.title+' '+x.summary+' '+x.why+' '+(x.details||'')+' '+((x.topics||[]).join(' '))).toLowerCase();if(!s.includes(state.q.toLowerCase()))return false;}return true;}
function llmText(x){const sources=(x.links||[]).map(l=>'- '+l.label+': '+l.url).join('\n');return `Хочу обсудить эту тему:\n\n${x.title}\n\nКраткое описание:\n${x.summary||''}\n\nПочему это важно:\n${x.why||''}\n\nПодробности:\n${x.details||'Дополнительных деталей в архиве пока нет. При необходимости проанализируй первоисточник и объясни тему глубже.'}\n\nИсточники:\n${sources||'Нет ссылок'}\n\nПожалуйста:\n1) объясни идею простыми словами;\n2) разложи технически, как это работает;\n3) укажи ограничения и спорные места;\n4) сравни с ближайшими альтернативами;\n5) скажи, где это практически применимо.`;}
async function copyForLLM(x,btn){try{await navigator.clipboard.writeText(llmText(x));btn.classList.add('copied');const old=btn.textContent;btn.textContent='✓ Скопировано';setTimeout(()=>{btn.textContent=old;btn.classList.remove('copied')},1500);}catch(e){const ta=document.createElement('textarea');ta.value=llmText(x);document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();btn.textContent='✓ Скопировано';setTimeout(()=>btn.textContent='⧉ Для LLM',1500);}}
const modal=document.getElementById('detailModal');const detailTitle=document.getElementById('detailTitle');const detailMeta=document.getElementById('detailMeta');const detailBody=document.getElementById('detailBody');const detailCopy=document.getElementById('detailCopy');let currentDetail=null;
function openDetail(x){currentDetail=x;detailTitle.textContent=x.title;const badges=(x.topics||[]).map(t=>`<span class="badge">${t}</span>`).join('');detailMeta.innerHTML=`${badges}${x.relevance?` · Практическая ценность: ${x.relevance}`:''} · ${new Date(x.date+'T00:00:00').toLocaleDateString('ru-RU')}`;const sources=(x.links||[]).map(l=>`<a href="${l.url}" target="_blank" rel="noopener">${l.label}</a>`).join('');const details=x.details||`<p>${x.summary||''}</p><p>${x.why||''}</p>`;detailBody.innerHTML=`<div class="detailsec"><h3>Развёрнутое summary</h3>${details.startsWith('<')?details:`<p>${details}</p>`}</div>${x.why?`<div class="detailsec"><h3>Почему это важно</h3><p>${x.why}</p></div>`:''}<div class="detailsec"><h3>Источники</h3><div class="source-list">${sources||'Нет ссылок'}</div></div>`;modal.classList.add('open');modal.setAttribute('aria-hidden','false');location.hash='article-'+x.id;}
function closeDetail(){modal.classList.remove('open');modal.setAttribute('aria-hidden','true');currentDetail=null;if(location.hash.startsWith('#article-'))history.replaceState(null,'',location.pathname+location.search);}
document.getElementById('detailClose').onclick=closeDetail;modal.onclick=e=>{if(e.target===modal)closeDetail()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail()});detailCopy.onclick=()=>currentDetail&&copyForLLM(currentDetail,detailCopy);
function render(){renderNav();document.querySelectorAll('.navbtn[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));const rows=data.filter(match).sort((a,b)=>b.date.localeCompare(a.date));const by={};rows.forEach(x=>(by[x.date]??=[]).push(x));const root=document.getElementById('content');root.innerHTML='';if(!rows.length){root.innerHTML='<div class="empty">Пока здесь нет материалов по выбранному фильтру.</div>';return;}Object.keys(by).sort().reverse().forEach(d=>{const sec=document.createElement('section');sec.className='day';sec.innerHTML=`<h2>${new Date(d+'T00:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})}</h2><div class="cards"></div>`;const cards=sec.querySelector('.cards');by[d].forEach(x=>{const c=document.createElement('article');c.className='card';const badges=(x.topics||[]).map(t=>`<span class="badge">${t}</span>`).join('');const rel=x.relevance?` · <span class="${x.relevance==='Высокая'?'high':'medium'}">Практическая ценность: ${x.relevance}</span>`:'';const links=(x.links||[]).map(l=>`<a href="${l.url}" target="_blank" rel="noopener">${l.label}</a>`).join('');c.innerHTML=`<div class="cardhead"><div><div class="title">${x.title}</div><div class="meta">${badges}${rel}</div></div><div class="actions"><button class="detailbtn">Подробнее</button><button class="copybtn">⧉ Для LLM</button><button class="pin ${pins.has(x.id)?'on':''}">${pins.has(x.id)?'★ Закреплено':'☆ Закрепить'}</button></div></div><div class="summary">${x.summary}</div>${x.why?`<div class="why"><b>Почему важно:</b> ${x.why}</div>`:''}${x.note?`<div class="meta">${x.note}</div>`:''}<div class="links">${links}</div>`;c.querySelector('.detailbtn').onclick=()=>openDetail(x);c.querySelector('.copybtn').onclick=e=>copyForLLM(x,e.currentTarget);c.querySelector('.pin').onclick=()=>{pins.has(x.id)?pins.delete(x.id):pins.add(x.id);savePins();render();};cards.appendChild(c)});root.appendChild(sec)});}
document.querySelectorAll('.navbtn[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;state.date=null;render();});document.getElementById('search').oninput=e=>{state.q=e.target.value;render()};render();const hashId=location.hash.startsWith('#article-')?location.hash.slice(9):'';if(hashId){const x=data.find(i=>i.id===hashId);if(x)openDetail(x);}
</script>
</body>
</html>
