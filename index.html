<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AI Digest Archive</title>
<style>
:root{--bg:#0b0e14;--panel:#121722;--panel2:#171d2a;--text:#e9eef8;--muted:#9aa6ba;--line:#273043;--accent:#7aa2ff;--good:#55d6a7;--warn:#ffc857}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.layout{display:grid;grid-template-columns:270px 1fr;min-height:100vh}.side{position:sticky;top:0;height:100vh;padding:22px;border-right:1px solid var(--line);background:#0e131d;overflow:auto}.main{padding:28px;max-width:1200px;width:100%}
.brand{font-weight:800;font-size:20px;margin-bottom:4px}.subtitle{font-size:12px;color:var(--muted);margin-bottom:22px}.navbtn,.chip{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:9px 11px;cursor:pointer}.navbtn{width:100%;text-align:left;margin:5px 0}.navbtn.active{border-color:var(--accent);background:#16213a}.section{margin:20px 0 8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.calendar{display:grid;gap:6px}.calday{display:flex;justify-content:space-between;align-items:center}.count{font-size:11px;color:var(--muted)}
.topbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:22px}.filters{display:flex;flex-wrap:wrap;gap:8px}.chip.active{border-color:var(--accent);background:#16213a}.search{flex:1;max-width:340px;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:10px}
.day{margin-bottom:34px}.day h2{margin:0 0 12px;font-size:22px}.cards{display:grid;gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}.cardhead{display:flex;justify-content:space-between;gap:16px}.title{font-size:18px;font-weight:750;margin:0 0 6px}.meta{font-size:12px;color:var(--muted)}.summary{margin:13px 0;line-height:1.55}.why{background:var(--panel2);border-radius:10px;padding:11px 12px;margin:10px 0;font-size:14px}.links{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}.pin{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:10px;padding:8px 10px;cursor:pointer;white-space:nowrap}.pin.on{color:#ffd35a;border-color:#6f5b24;background:#2a2411}.empty{border:1px dashed var(--line);padding:24px;border-radius:14px;color:var(--muted);text-align:center}
.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#1b2434;border:1px solid var(--line);margin-right:5px;color:#b9c5d8}.high{color:var(--good)}.medium{color:var(--warn)}
@media(max-width:800px){.layout{grid-template-columns:1fr}.side{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line)}.main{padding:18px}.topbar{align-items:stretch;flex-direction:column}.search{max-width:none}}
</style>
</head>
<body>
<div class="layout">
  <aside class="side">
    <div class="brand">AI Digest Archive</div>
    <div class="subtitle">Робототехника · LLM · AI-инструменты</div>
    <button class="navbtn active" data-view="all">Все материалы</button>
    <button class="navbtn" data-view="pins">★ Закрепы</button>
    <div class="section">Темы</div>
    <div id="topicNav"></div>
    <div class="section">Календарь</div>
    <div id="calendar" class="calendar"></div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div id="filters" class="filters"></div>
      <input id="search" class="search" placeholder="Поиск по архиву…" />
    </div>
    <div id="content"></div>
  </main>
</div>

<script id="digest-data" type="application/json">
[]
</script>
<script>
const data = JSON.parse(document.getElementById('digest-data').textContent || '[]');
const pinsKey='ai-digest-pins-v1';
const pins=new Set(JSON.parse(localStorage.getItem(pinsKey)||'[]'));
let state={view:'all',topic:'all',date:null,q:''};
const topicOrder=['Робототехника','SLAM/Навигация','Квадрупеды','Гуманоиды','VLA/World Models','Perception','LLM','Coding Agents','Open-weight','Инструменты'];
function topics(){return [...new Set(data.flatMap(x=>x.topics||[]))].sort((a,b)=>topicOrder.indexOf(a)-topicOrder.indexOf(b));}
function savePins(){localStorage.setItem(pinsKey,JSON.stringify([...pins]));}
function renderNav(){const nav=document.getElementById('topicNav');nav.innerHTML='';topics().forEach(t=>{const b=document.createElement('button');b.className='navbtn';b.textContent=t;b.onclick=()=>{state.topic=t;state.date=null;state.view='all';render();};nav.appendChild(b)});
const counts={}; data.forEach(x=>counts[x.date]=(counts[x.date]||0)+1); const cal=document.getElementById('calendar');cal.innerHTML=''; Object.keys(counts).sort().reverse().forEach(d=>{const b=document.createElement('button');b.className='navbtn calday';b.innerHTML=`<span>${new Date(d+'T00:00:00').toLocaleDateString('ru-RU',{day:'2-digit',month:'short',year:'numeric'})}</span><span class="count">${counts[d]}</span>`;b.onclick=()=>{state.date=d;state.topic='all';state.view='all';render();};cal.appendChild(b)});
const fs=document.getElementById('filters');fs.innerHTML='';['all',...topics()].forEach(t=>{const b=document.createElement('button');b.className='chip'+(state.topic===t?' active':'');b.textContent=t==='all'?'Все':t;b.onclick=()=>{state.topic=t;state.date=null;render()};fs.appendChild(b)});}
function match(x){if(state.view==='pins'&&!pins.has(x.id))return false;if(state.topic!=='all'&&!(x.topics||[]).includes(state.topic))return false;if(state.date&&x.date!==state.date)return false;if(state.q){const s=(x.title+' '+x.summary+' '+x.why+' '+((x.topics||[]).join(' '))).toLowerCase();if(!s.includes(state.q.toLowerCase()))return false;}return true;}
function render(){renderNav();document.querySelectorAll('.navbtn[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));const rows=data.filter(match).sort((a,b)=>b.date.localeCompare(a.date));const by={};rows.forEach(x=>(by[x.date]??=[]).push(x));const root=document.getElementById('content');root.innerHTML='';if(!rows.length){root.innerHTML='<div class="empty">Пока здесь нет материалов по выбранному фильтру.</div>';return;}Object.keys(by).sort().reverse().forEach(d=>{const sec=document.createElement('section');sec.className='day';sec.innerHTML=`<h2>${new Date(d+'T00:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})}</h2><div class="cards"></div>`;const cards=sec.querySelector('.cards');by[d].forEach(x=>{const c=document.createElement('article');c.className='card';const badges=(x.topics||[]).map(t=>`<span class="badge">${t}</span>`).join('');const rel=x.relevance?` · <span class="${x.relevance==='Высокая'?'high':'medium'}">Практическая ценность: ${x.relevance}</span>`:'';const links=(x.links||[]).map(l=>`<a href="${l.url}" target="_blank" rel="noopener">${l.label}</a>`).join('');c.innerHTML=`<div class="cardhead"><div><div class="title">${x.title}</div><div class="meta">${badges}${rel}</div></div><button class="pin ${pins.has(x.id)?'on':''}">${pins.has(x.id)?'★ Закреплено':'☆ Закрепить'}</button></div><div class="summary">${x.summary}</div>${x.why?`<div class="why"><b>Почему важно:</b> ${x.why}</div>`:''}${x.note?`<div class="meta">${x.note}</div>`:''}<div class="links">${links}</div>`;c.querySelector('.pin').onclick=()=>{pins.has(x.id)?pins.delete(x.id):pins.add(x.id);savePins();render();};cards.appendChild(c)});root.appendChild(sec)});}
document.querySelectorAll('.navbtn[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;state.date=null;render();});document.getElementById('search').oninput=e=>{state.q=e.target.value;render()};render();
</script>
</body>
</html>
