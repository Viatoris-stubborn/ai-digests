<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Digest Archive</title>
<style>
:root{--bg:#0b0e14;--side:#0e131d;--panel:#121722;--panel2:#171d2a;--text:#e9eef8;--muted:#9aa6ba;--line:#273043;--accent:#7aa2ff;--good:#55d6a7;--warn:#ffc857;--active:#16213a;--badge:#1b2434;--overlay:rgba(3,6,12,.78);--pinbg:#2a2411;--pinborder:#6f5b24;--pintext:#ffd35a}
:root[data-theme="light"]{--bg:#f6f8fb;--side:#fff;--panel:#fff;--panel2:#f1f4f8;--text:#182033;--muted:#667085;--line:#d8dee8;--accent:#356ae6;--good:#16835d;--warn:#9a6700;--active:#eaf1ff;--badge:#eef3f8;--overlay:rgba(32,41,56,.35);--pinbg:#fff7d6;--pinborder:#e3bd4f;--pintext:#8a6500}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.layout{display:grid;grid-template-columns:270px 1fr;min-height:100vh}.side{position:sticky;top:0;height:100vh;padding:22px;border-right:1px solid var(--line);background:var(--side);overflow:auto}.main{padding:28px;max-width:1200px;width:100%}
.brandrow{display:flex;justify-content:space-between;gap:10px}.brand{font-weight:800;font-size:20px}.subtitle{font-size:12px;color:var(--muted);margin:4px 0 22px}.themebtn,.navbtn,.chip,.pin,.detailbtn,.copybtn,.closebtn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:9px 11px;cursor:pointer}.themebtn{padding:7px 9px}.navbtn{width:100%;text-align:left;margin:5px 0}.navbtn.active,.chip.active{border-color:var(--accent);background:var(--active)}.section{margin:20px 0 8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.calendar{display:grid;gap:6px}.calday{display:flex;justify-content:space-between}.count{font-size:11px;color:var(--muted)}
.topbar{display:flex;gap:10px;justify-content:space-between;margin-bottom:22px}.filters{display:flex;flex-wrap:wrap;gap:8px}.search{flex:1;max-width:340px;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:10px}
.day{margin-bottom:34px}.day h2{margin:0 0 12px}.cards{display:grid;gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}.cardhead{display:flex;justify-content:space-between;gap:16px}.title{font-size:18px;font-weight:750}.meta{font-size:12px;color:var(--muted)}.summary{margin:13px 0;line-height:1.55}.why{background:var(--panel2);border-radius:10px;padding:11px 12px;margin:10px 0;font-size:14px}.links,.actions{display:flex;gap:10px;flex-wrap:wrap}.actions{justify-content:flex-end}.copybtn{color:var(--accent)}.pin.on{color:var(--pintext);border-color:var(--pinborder);background:var(--pinbg)}.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:var(--badge);border:1px solid var(--line);margin-right:5px}.high{color:var(--good)}.medium{color:var(--warn)}.empty{border:1px dashed var(--line);padding:24px;border-radius:14px;color:var(--muted);text-align:center}
.modal{position:fixed;inset:0;background:var(--overlay);display:none;align-items:center;justify-content:center;padding:24px;z-index:1000}.modal.open{display:flex}.modalbox{width:min(900px,100%);max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px}.modalhead{display:flex;justify-content:space-between;gap:16px}.detailbody{line-height:1.65;margin-top:18px}.detailsec{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}.hint{font-size:12px;color:var(--muted);margin-top:8px}
@media(max-width:800px){.layout{grid-template-columns:1fr}.side{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line)}.main{padding:18px}.topbar{flex-direction:column}.search{max-width:none}.cardhead{flex-direction:column}}
</style></head><body>
<div class="layout"><aside class="side"><div class="brandrow"><div class="brand">AI Digest Archive</div><button id="themeToggle" class="themebtn">☀️</button></div><div class="subtitle">Робототехника · LLM · AI-инструменты</div><button class="navbtn active" data-view="all">Все материалы</button><button class="navbtn" data-view="pins">★ Закрепы</button><div class="section">Темы</div><div id="topicNav"></div><div class="section">Календарь</div><div id="calendar" class="calendar"></div></aside>
<main class="main"><div class="topbar"><div id="filters" class="filters"></div><input id="search" class="search" placeholder="Поиск по архиву…"></div><div id="content"><div class="empty">Загрузка…</div></div></main></div>
<div id="detailModal" class="modal"><div class="modalbox"><div class="modalhead"><div><h1 id="detailTitle"></h1><div id="detailMeta" class="meta"></div></div><button id="detailClose" class="closebtn">✕ Закрыть</button></div><div id="detailBody" class="detailbody"></div><div class="actions"><button id="detailCopy" class="copybtn">⧉ Скопировать для LLM</button></div><div class="hint">Скопированный контекст можно вставить в любой LLM-чат.</div></div></div>
<script>
const pinsKey='ai-digest-pins-v1',themeKey='ai-digest-theme-v1';let data=[];const pins=new Set(JSON.parse(localStorage.getItem(pinsKey)||'[]'));let state={view:'all',topic:'all',date:null,q:''};
function applyTheme(t){document.documentElement.dataset.theme=t;themeToggle.textContent=t==='light'?'🌙':'☀️'}applyTheme(localStorage.getItem(themeKey)||((matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark'));themeToggle.onclick=()=>{const t=document.documentElement.dataset.theme==='light'?'dark':'light';localStorage.setItem(themeKey,t);applyTheme(t)};
async function loadData(){const m=await fetch('data/manifest.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('manifest');return r.json()});const chunks=await Promise.all((m.files||[]).map(f=>fetch(f,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(f);return r.json()})));data=chunks.flat()}
const topicOrder=['Робототехника','SLAM/Навигация','Квадрупеды','Гуманоиды','VLA/World Models','Perception','LLM','Coding Agents','Open-weight','Инструменты'];function topics(){return [...new Set(data.flatMap(x=>x.topics||[]))].sort((a,b)=>topicOrder.indexOf(a)-topicOrder.indexOf(b))}
function savePins(){localStorage.setItem(pinsKey,JSON.stringify([...pins]))}function renderNav(){topicNav.innerHTML='';topics().forEach(t=>{const b=document.createElement('button');b.className='navbtn';b.textContent=t;b.onclick=()=>{state.topic=t;state.date=null;state.view='all';render()};topicNav.appendChild(b)});const counts={};data.forEach(x=>counts[x.date]=(counts[x.date]||0)+1);calendar.innerHTML='';Object.keys(counts).sort().reverse().forEach(d=>{const b=document.createElement('button');b.className='navbtn calday';b.innerHTML='<span>'+new Date(d+'T00:00:00').toLocaleDateString('ru-RU',{day:'2-digit',month:'short',year:'numeric'})+'</span><span class="count">'+counts[d]+'</span>';b.onclick=()=>{state.date=d;state.topic='all';render()};calendar.appendChild(b)});filters.innerHTML='';['all',...topics()].forEach(t=>{const b=document.createElement('button');b.className='chip'+(state.topic===t?' active':'');b.textContent=t==='all'?'Все':t;b.onclick=()=>{state.topic=t;state.date=null;render()};filters.appendChild(b)})}
function match(x){if(state.view==='pins'&&!pins.has(x.id))return false;if(state.topic!=='all'&&!(x.topics||[]).includes(state.topic))return false;if(state.date&&x.date!==state.date)return false;if(state.q&&!((x.title+' '+x.summary+' '+x.why+' '+(x.details||'')+' '+(x.topics||[]).join(' ')).toLowerCase().includes(state.q.toLowerCase())))return false;return true}
function llmText(x){return 'Хочу обсудить эту тему:\n\n'+x.title+'\n\nКратко:\n'+(x.summary||'')+'\n\nПочему важно:\n'+(x.why||'')+'\n\nПодробности:\n'+(x.details||'')+'\n\nИсточники:\n'+(x.links||[]).map(l=>'- '+l.label+': '+l.url).join('\n')+'\n\nОбъясни идею, технический механизм, ограничения, альтернативы и практическое применение.'}
async function copyLLM(x,b){await navigator.clipboard.writeText(llmText(x));const s=b.textContent;b.textContent='✓ Скопировано';setTimeout(()=>b.textContent=s,1200)}
const modal=detailModal;let current=null;function openDetail(x){current=x;detailTitle.textContent=x.title;detailMeta.innerHTML=(x.topics||[]).map(t=>'<span class="badge">'+t+'</span>').join('')+' · '+new Date(x.date+'T00:00:00').toLocaleDateString('ru-RU');detailBody.innerHTML='<div class="detailsec"><h3>Развёрнутое summary</h3>'+(x.details||('<p>'+x.summary+'</p>'))+'</div><div class="detailsec"><h3>Почему важно</h3><p>'+(x.why||'')+'</p></div><div class="detailsec"><h3>Источники</h3>'+(x.links||[]).map(l=>'<a target="_blank" rel="noopener" href="'+l.url+'">'+l.label+'</a>').join(' · ')+'</div>';modal.classList.add('open');location.hash='article-'+x.id}function closeDetail(){modal.classList.remove('open');current=null;if(location.hash.startsWith('#article-'))history.replaceState(null,'',location.pathname+location.search)}
detailClose.onclick=closeDetail;modal.onclick=e=>{if(e.target===modal)closeDetail()};detailCopy.onclick=()=>current&&copyLLM(current,detailCopy);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail()});
function render(){renderNav();document.querySelectorAll('.navbtn[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));const rows=data.filter(match).sort((a,b)=>b.date.localeCompare(a.date));const by={};rows.forEach(x=>(by[x.date]??=[]).push(x));content.innerHTML='';if(!rows.length){content.innerHTML='<div class="empty">Пока здесь нет материалов.</div>';return}Object.keys(by).sort().reverse().forEach(d=>{const sec=document.createElement('section');sec.className='day';sec.innerHTML='<h2>'+new Date(d+'T00:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})+'</h2><div class="cards"></div>';const cards=sec.querySelector('.cards');by[d].forEach(x=>{const c=document.createElement('article');c.className='card';const badges=(x.topics||[]).map(t=>'<span class="badge">'+t+'</span>').join('');const links=(x.links||[]).map(l=>'<a target="_blank" rel="noopener" href="'+l.url+'">'+l.label+'</a>').join('');c.innerHTML='<div class="cardhead"><div><div class="title">'+x.title+'</div><div class="meta">'+badges+(x.relevance?' · Практическая ценность: '+x.relevance:'')+'</div></div><div class="actions"><button class="detailbtn">Подробнее</button><button class="copybtn">⧉ Для LLM</button><button class="pin '+(pins.has(x.id)?'on':'')+'">'+(pins.has(x.id)?'★ Закреплено':'☆ Закрепить')+'</button></div></div><div class="summary">'+x.summary+'</div>'+(x.why?'<div class="why"><b>Почему важно:</b> '+x.why+'</div>':'')+'<div class="links">'+links+'</div>';c.querySelector('.detailbtn').onclick=()=>openDetail(x);c.querySelector('.copybtn').onclick=e=>copyLLM(x,e.currentTarget);c.querySelector('.pin').onclick=()=>{pins.has(x.id)?pins.delete(x.id):pins.add(x.id);savePins();render()};cards.appendChild(c)});content.appendChild(sec)})}
document.querySelectorAll('.navbtn[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;state.date=null;render()});search.oninput=e=>{state.q=e.target.value;render()};
loadData().then(()=>{render();const id=location.hash.startsWith('#article-')?location.hash.slice(9):'';if(id){const x=data.find(v=>v.id===id);if(x)openDetail(x)}}).catch(e=>{console.error(e);content.innerHTML='<div class="empty">Ошибка загрузки архива.</div>'});
</script></body></html>
